name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          cat > .env << EOF
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          DATABASE_URL=postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@postgres:5432/${{ secrets.POSTGRES_DB }}
          AUTH_SECRET=${{ secrets.AUTH_SECRET }}
          AUTH_URL=${{ secrets.AUTH_URL }}
          EOF

      - name: Stop existing containers
        run: |
          docker-compose -f docker-compose.yml down || true

      - name: Pull latest postgres image
        run: |
          docker-compose -f docker-compose.yml pull postgres || true

      - name: Build application
        run: |
          docker-compose -f docker-compose.yml build --no-cache app

      - name: Start database
        run: |
          docker-compose -f docker-compose.yml up -d postgres

          echo "Waiting for database to be healthy..."

          for i in {1..30}; do
            status=$(docker inspect --format='{{.State.Health.Status}}' reguai-postgres 2>/dev/null || echo "starting")

            echo "Postgres status: $status"

            if [ "$status" = "healthy" ]; then
              echo "✅ Database is healthy!"
              exit 0
            fi

            docker-compose -f docker-compose.yml logs --tail=20 postgres || true
            sleep 3
          done

          echo "❌ Database failed to become healthy"
          docker-compose -f docker-compose.yml logs postgres
          exit 1

      - name: Run database migrations
        run: |
          docker-compose -f docker-compose.yml run --rm app sh -c "npx prisma migrate deploy && npx prisma generate"

      - name: Start application
        run: |
          docker-compose -f docker-compose.yml up -d app

      - name: Wait for application to start
        run: |
          echo "Waiting for application to be ready..."
          sleep 15

      - name: Health check
        run: |
          max_attempts=10
          attempt=0

          while [ $attempt -lt $max_attempts ]; do
            if curl -f http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "✅ Application is healthy!"
              exit 0
            fi

            attempt=$((attempt + 1))
            echo "⏳ Attempt $attempt/$max_attempts - Application not ready yet..."
            sleep 5
          done

          echo "❌ Health check failed after $max_attempts attempts"
          docker-compose -f docker-compose.yml logs app
          exit 1

      - name: Show deployment status
        run: |
          echo "🚀 Deployment completed successfully!"
          docker-compose -f docker-compose.yml ps

      - name: Cleanup old images
        if: success()
        run: |
          docker image prune -af --filter "until=24h"

      - name: Cleanup .env file
        if: always()
        run: |
          rm -f .env
